[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
test_build_src = true
monitor_speed = 115200

; Web UI (firmware/data/index.html) is served from a LittleFS filesystem image.
; Upload it once with: pio run --target uploadfs
board_build.filesystem = littlefs
; Large app partition + ~960KB filesystem to hold the web UI and the bundled
; airline logo tiles (LittleFS allocates each small tile in a 4KB block).
board_build.partitions = huge_app.csv

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.4.2
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git

lib_ldf_mode = deep+

build_src_filter =
    +<*.cpp>
    +<**/*.cpp>
    +<../adapters/*.cpp>
    +<../core/*.cpp>

build_flags =
    -I .
    -I include
    -I src
    -I adapters
    -I core
    -I models
    -I interfaces
    -I utils
    -I config
    ; HUB75 DMA framebuffer = width*(height/2)*depth*2 bytes. Dropping 8->6 bits
    ; frees ~16KB of DMA-capable internal RAM (128x64: ~64KB -> ~48KB), widening
    ; the largest free block (~40KB -> ~56KB) so the TLS handshake fits reliably.
    ; Cost: 64 brightness levels/channel instead of 256 (minor banding). Raise back
    ; to 8 once on the S3 (PSRAM removes the constraint).
    -D PIXEL_COLOR_DEPTH_BITS=6

; ─────────────────────────────────────────────────────────────────────────────
; STAGED — ESP32-S3-DevKitC-1 N16R8 (16MB flash + 8MB octal PSRAM).
; NOT yet wired to hardware. See docs/s3-migration.md for the HUB75 pin remap.
; Why: with PSRAM, arduino-esp32 spills allocations >=16KB to PSRAM, so the
; mbedTLS handshake buffers leave internal RAM entirely — the fragmentation that
; throttles enrichment on the plain ESP32 disappears, and color depth goes back
; to full 8-bit (note: NO PIXEL_COLOR_DEPTH_BITS override here).
; Build (once the board is wired): pio run -e esp32s3 -t upload
[env:esp32s3]
; IMPORTANT: S3 octal PSRAM + the LCD_CAM HUB75 backend need arduino-esp32 3.x (IDF5).
; Verify your installed `espressif32` platform ships arduino-esp32 >=3.0; if not, use
; the pioarduino fork (pick a release tag from
; https://github.com/pioarduino/platform-espressif32/releases):
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/<tag>/platform-espressif32.zip
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
test_build_src = true
monitor_speed = 115200
board_build.filesystem = littlefs
; Frugal 16MB layout: 2x3MB app (OTA-capable) + ~9.9MB LittleFS. See partitions_16MB.csv.
board_build.partitions = partitions_16MB.csv
; The stock esp32-s3-devkitc-1 profile is the N8/no-PSRAM variant (maximum_size 8MB).
; Override BOTH so a 16MB app partition is accepted on the N16R8.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; N16R8 = QIO flash + OPI (octal) PSRAM. memory_type enables the 8MB PSRAM; the wrong
; value (qio_qspi) leaves the octal part uninitialized -> boot loop.
board_build.arduino.memory_type = qio_opi
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.4.2
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
lib_ldf_mode = deep+
build_src_filter =
    +<*.cpp>
    +<**/*.cpp>
    +<../adapters/*.cpp>
    +<../core/*.cpp>
build_flags =
    -I .
    -I include
    -I src
    -I adapters
    -I core
    -I models
    -I interfaces
    -I utils
    -I config
    -DBOARD_HAS_PSRAM
    ; Serial -> UART0 via the DevKitC-1's UART-bridge USB port (matches monitor_speed).
    ; For console over the NATIVE USB port instead, add -DARDUINO_USB_CDC_ON_BOOT=1.