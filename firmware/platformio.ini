[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
test_build_src = true
monitor_speed = 115200

; Web UI (firmware/data/index.html) is served from a LittleFS filesystem image.
; Upload it once with: pio run --target uploadfs
board_build.filesystem = littlefs
; Pre-compresses data/index.html -> data/index.html.gz before uploadfs, so the
; device can serve it with Content-Encoding: gzip. Runs every build; cannot drift.
extra_scripts = pre:../tools/gzip_web_assets.py
; Large app partition + ~960KB filesystem to hold the web UI and the bundled
; airline logo tiles (LittleFS allocates each small tile in a 4KB block).
board_build.partitions = huge_app.csv

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.4.2
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git

lib_ldf_mode = deep+

build_src_filter =
    +<*.cpp>
    +<**/*.cpp>
    +<../adapters/*.cpp>
    +<../core/*.cpp>

build_flags =
    -I .
    -I include
    -I src
    -I adapters
    -I core
    -I models
    -I interfaces
    -I utils
    -I config
    ; HUB75 DMA framebuffer = width*(height/2)*depth*2 bytes. Dropping 8->6 bits
    ; frees ~16KB of DMA-capable internal RAM (128x64: ~64KB -> ~48KB), widening
    ; the largest free block (~40KB -> ~56KB) so the TLS handshake fits reliably.
    ; Cost: 64 brightness levels/channel instead of 256 (minor banding). Raise back
    ; to 8 once on the S3 (PSRAM removes the constraint).
    -D PIXEL_COLOR_DEPTH_BITS=6

; ─────────────────────────────────────────────────────────────────────────────
; STAGED — ESP32-S3-DevKitC-1 N16R8 (16MB flash + 8MB octal PSRAM).
; NOT yet wired to hardware. See docs/s3-migration.md for the HUB75 pin remap.
; Why: with PSRAM, arduino-esp32 prefers PSRAM for allocations LARGER THAN
; CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL, which this toolchain sets to 4096 bytes
; (NOT 16KB — verified in the packaged sdkconfig; it's also a preference, not a
; guarantee: either pool falls back to the other). So the mbedTLS handshake
; buffers leave internal RAM and the fragmentation that throttles enrichment on
; the plain ESP32 goes away.
; Color depth: this env omits PIXEL_COLOR_DEPTH_BITS, so it builds at 8-bit —
; but that is NOT free. PSRAM trades a memory limit for a DMA BANDWIDTH limit,
; so validate refresh rate on real hardware before assuming 8-bit is fine.
; Build (once the board is wired): pio run -e esp32s3 -t upload
[env:esp32s3]
; TOOLCHAIN REALITY (verified, not assumed): bare `platform = espressif32` resolves
; to arduino-esp32 2.0.17 / IDF 4.4.7 — the official platform still pins 2.0.17 even
; at v7.0.1 (v7 bumped ESP-IDF, not Arduino). This env DOES build against 2.0.17.
; 3.x is only reachable via the pioarduino fork, and it is not required to build —
; it's the upgrade path if the S3 LCD_CAM/octal-PSRAM behavior misbehaves on 2.x:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/<tag>/platform-espressif32.zip
; NOTE if you switch: setCACertBundle() takes 1 arg on 2.x, 2 args from 3.0.4+, and
; 3.0.0-3.0.3 is broken (sizeof on a pointer). WiFiClientSecure -> NetworkClientSecure.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
test_build_src = true
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:../tools/gzip_web_assets.py
; Frugal 16MB layout: 2x3MB app (OTA-capable) + ~9.9MB LittleFS. See partitions_16MB.csv.
board_build.partitions = partitions_16MB.csv
; The stock esp32-s3-devkitc-1 profile is the N8/no-PSRAM variant (maximum_size 8MB).
; Override BOTH so a 16MB app partition is accepted on the N16R8.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; N16R8 = QIO flash + OPI (octal) PSRAM. memory_type enables the 8MB PSRAM; the wrong
; value (qio_qspi) leaves the octal part uninitialized -> boot loop.
board_build.arduino.memory_type = qio_opi
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.4.2
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
lib_ldf_mode = deep+
build_src_filter =
    +<*.cpp>
    +<**/*.cpp>
    +<../adapters/*.cpp>
    +<../core/*.cpp>
build_flags =
    -I .
    -I include
    -I src
    -I adapters
    -I core
    -I models
    -I interfaces
    -I utils
    -I config
    -DBOARD_HAS_PSRAM
    ; EXPERIMENT (2026-07-16): drop 8-bit -> 6-bit colour depth on the S3 too.
    ; This env previously omitted the flag and ran at 8 bits — the maximum HUB75 DMA
    ; load — which is precisely the risk the comment above this env warns about and
    ; which was never validated on hardware. Measuring whether continuous I2S DMA is
    ; starving the radio: baseline ping to the device is 75% loss / 1206ms avg while
    ; the router answers in 3ms, with modem sleep verified OFF and RSSI -63.
    ; If latency collapses, the panel is the cause. If not, revert this and look at
    ; 2.4GHz congestion instead.
    -D PIXEL_COLOR_DEPTH_BITS=6
    ; Serial -> the NATIVE USB port (the one silkscreened USB, hwid 303a:1001), NOT the
    ; UART-bridge port. Without this flag ARDUINO_USB_CDC_ON_BOOT defaults to 0, Serial
    ; binds to UART0, and every Serial.print goes out the UART port. The IDF console is
    ; separate: CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG=y mirrors log_e()/panics to
    ; the native port regardless — so monitoring the native port without this flag shows
    ; [E] lines and panic dumps while silently dropping [boot]/[heapdiag]/fetch logs.
    ; That asymmetry reads as "the firmware stopped logging" and costs hours.
    -DARDUINO_USB_CDC_ON_BOOT=1