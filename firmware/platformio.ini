[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
test_build_src = true
monitor_speed = 115200

; Web UI (firmware/data/index.html) is served from a LittleFS filesystem image.
; Upload it once with: pio run --target uploadfs
board_build.filesystem = littlefs
; Large app partition + ~960KB filesystem to hold the web UI and the bundled
; airline logo tiles (LittleFS allocates each small tile in a 4KB block).
board_build.partitions = huge_app.csv

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.4.2
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git

lib_ldf_mode = deep+

build_src_filter =
    +<*.cpp>
    +<**/*.cpp>
    +<../adapters/*.cpp>
    +<../core/*.cpp>

build_flags =
    -I .
    -I include
    -I src
    -I adapters
    -I core
    -I models
    -I interfaces
    -I utils
    -I config